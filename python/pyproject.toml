[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroset-eval"
version = "0.1.0"
description = "Transparent evaluation and A/B testing for OpenAI-compatible endpoints"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
neuroset-eval = "neuroset_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroset_eval*"]
